    "litellm>=1.92.0",
    "mypy>=2.3.0",
    "ollama>=0.6.2",
    "playwright>=1.61.0",
    "pre-commit>=4.6.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "ruff>=0.15.21",
    "typer>=0.26.8",
